<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administration — ETS LA REFERENCE</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-dashboard">

<!-- ===== Connexion ===== -->
<div id="loginScreen" class="d-login hidden">
  <div class="d-login-card">
    <svg class="d-logo" viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#12403c"/>
      <rect x="19" y="16" width="7" height="32" rx="1.5" fill="#f6f1e7"/>
      <rect x="19" y="16" width="26" height="7" rx="1.5" fill="#f6f1e7"/>
      <rect x="19" y="28.5" width="20" height="7" rx="1.5" fill="#c5601f"/>
      <rect x="19" y="41" width="26" height="7" rx="1.5" fill="#f6f1e7"/>
    </svg>
    <h1>Administration</h1>
    <p>Connecte-toi avec ton compte administrateur.</p>
    <label class="d-label" for="lgUser">Nom d'utilisateur</label>
    <input id="lgUser" class="d-input" autocomplete="username">
    <label class="d-label" for="lgPass">Mot de passe</label>
    <input id="lgPass" class="d-input" type="password" autocomplete="current-password">
    <button class="d-btn d-primary d-block" data-action="login">Se connecter</button>
    <div id="lgMsg" class="d-alert hidden"></div>
  </div>
</div>

<!-- ===== Application ===== -->
<div id="app" class="d-app hidden">
  <aside class="d-side">
    <div class="d-brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#f6f1e7" fill-opacity="0.12"/>
        <rect x="19" y="16" width="7" height="32" rx="1.5" fill="#f6f1e7"/>
        <rect x="19" y="16" width="26" height="7" rx="1.5" fill="#f6f1e7"/>
        <rect x="19" y="28.5" width="20" height="7" rx="1.5" fill="#c5601f"/>
        <rect x="19" y="41" width="26" height="7" rx="1.5" fill="#f6f1e7"/>
      </svg>
      <div><strong>ETS LA REFERENCE</strong><span>Administration</span></div>
    </div>

    <nav class="d-nav">
      <button class="d-nav-item" data-action="nav" data-view="overview">Tableau de bord</button>
      <button class="d-nav-item" data-action="nav" data-view="products" data-cat="">
        <span>Tous les produits</span><span class="d-count" id="cntProducts">0</span>
      </button>
      <button class="d-nav-item" id="catToggle" data-action="toggle-cats">
        <span>Catégories</span><span class="d-chev">▾</span>
      </button>
      <div class="d-sub hidden" id="catList"></div>
      <button class="d-nav-item" data-action="nav" data-view="orders">
        <span>Commandes</span><span class="d-count d-hot hidden" id="cntPending">0</span>
      </button>
    </nav>

    <div class="d-side-foot">
      <span>Connecté : <strong id="meName"></strong></span>
      <a href="index.html" target="_blank">Voir la boutique ↗</a>
      <button class="d-link" data-action="password-open">Changer le mot de passe</button>
      <button class="d-link" data-action="logout">Se déconnecter</button>
    </div>
  </aside>

  <div class="d-content">
    <div class="d-topbar">
      <h2 id="viewTitle"></h2>
      <div id="viewActions"></div>
    </div>
    <div id="view"></div>
  </div>
</div>

<div id="modal" class="d-modal hidden" data-action="close-modal"><div class="d-modal-box" id="modalBox"></div></div>
<div id="toast" class="d-toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
